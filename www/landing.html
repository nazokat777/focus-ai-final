<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Focus AI — Focus • Adapt • Dominate</title>
<meta name="description" content="Diqqatingni qaytar. Intizom qur. O'z hayotingning qahramoniga aylan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FOCUS AI · CINEMATIC LANDING · DESIGN TOKENS
   ============================================================ */
:root{
  --black:#000000; --void:#030806; --elev:#081209;
  --neon:#39FF8C; --neon-br:#7CFFB5; --neon-dp:#0E9F55; --onneon:#04130a;
  --neon-rgb:57,255,140;
  --silver:#C7CFCA; --silver-dim:#6E7A73;
  --text:#EAFBF0; --muted:#7a9784; --line:rgba(90,255,160,.10);
  --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease-out:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.42,.58,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:thin;scrollbar-color:rgba(var(--neon-rgb),.35) transparent}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
html{overflow-x:clip}
body{
  background:var(--black);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:clip;
}
::selection{background:rgba(var(--neon-rgb),.25);color:var(--neon-br)}

/* ---------- kino-tipografika shkalasi ---------- */
.display{font-weight:900;letter-spacing:-.035em;line-height:.96;
  font-size:clamp(44px,10vw,124px)}
.headline{font-weight:800;letter-spacing:-.025em;line-height:1.04;
  font-size:clamp(30px,5.6vw,64px)}
.lead{font-weight:400;color:var(--muted);line-height:1.6;
  font-size:clamp(15px,2.2vw,19px)}
.eyebrow{font:700 clamp(10px,1.4vw,13px)/1 var(--mono);letter-spacing:.34em;
  text-transform:uppercase;color:var(--neon)}
.mono{font-family:var(--mono)}
.tx-neon{color:var(--neon)}
.tx-silver{background:linear-gradient(160deg,#f4f8f5 20%,var(--silver) 50%,#5c6660 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- global kino-qatlamlar ---------- */
.grain{position:fixed;inset:-100%;z-index:96;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grain 8s steps(10) infinite}
@keyframes grain{
  0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-8%)}
  20%{transform:translate(-13%,3%)}30%{transform:translate(6%,-10%)}
  40%{transform:translate(-4%,12%)}50%{transform:translate(-11%,4%)}
  60%{transform:translate(12%,0)}70%{transform:translate(0,10%)}
  80%{transform:translate(3%,13%)}90%{transform:translate(-9%,7%)}}
.vignette{position:fixed;inset:0;z-index:95;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.5) 100%)}

/* ---------- shisha (glassmorphism) ---------- */
.glass{background:rgba(8,18,10,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 30px 90px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- sahna asosi ---------- */
.scene{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center}
.scene-inner{position:relative;z-index:5;width:min(1200px,92vw);margin:0 auto}
.bgvideo{position:absolute;inset:0;overflow:hidden;z-index:0}
.bgvideo video,.bgvideo img{width:100%;height:100%;object-fit:cover;display:block}
.bgvideo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.25) 30%,rgba(0,0,0,.25) 65%,#000 100%)}

/* ---------- magnetic CTA ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;
  height:60px;padding:0 34px;border-radius:18px;border:0;cursor:pointer;
  font:700 16px var(--sans);letter-spacing:.01em;color:var(--onneon);
  background:linear-gradient(180deg,var(--neon-br),var(--neon));
  box-shadow:0 16px 50px -12px rgba(var(--neon-rgb),.55),inset 0 1px 0 rgba(255,255,255,.45);
  text-decoration:none;will-change:transform;transition:box-shadow .3s}
.btn:hover{box-shadow:0 20px 70px -10px rgba(var(--neon-rgb),.8),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{background:transparent;color:var(--text);
  border:1px solid rgba(255,255,255,.16);box-shadow:none}
.btn-ghost:hover{border-color:rgba(var(--neon-rgb),.5);box-shadow:0 0 40px -10px rgba(var(--neon-rgb),.4)}

/* ---------- navigatsiya ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:90;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 18px) clamp(18px,4vw,44px) 14px;
  transition:transform .5s var(--ease-out)}
.nav .logo{font:900 19px var(--sans);letter-spacing:-.02em;color:var(--text);text-decoration:none}
.nav .logo em{color:var(--neon);font-style:normal;font:700 10px var(--mono);
  background:rgba(var(--neon-rgb),.12);border:1px solid rgba(var(--neon-rgb),.25);
  padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:3px;letter-spacing:.08em}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:999px;padding:3px;backdrop-filter:blur(12px)}
.lang button{font:600 11px/1 var(--mono);letter-spacing:.05em;color:var(--muted);
  background:none;border:0;padding:6px 10px;border-radius:999px;cursor:pointer;transition:.2s}
.lang button.on{background:var(--neon);color:var(--onneon)}

/* ---------- skroll progress (o'ng qirra) ---------- */
.rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:90;
  display:flex;flex-direction:column;gap:10px}
.rail a{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);
  transition:.3s;display:block}
.rail a.on{background:var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.8);transform:scale(1.5)}
@media(max-width:760px){.rail{display:none}}

/* ---------- loader: terminal-boot ---------- */
#loader{position:fixed;inset:0;z-index:200;background:var(--black);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
#loader .llogo{width:min(190px,44vw);height:auto;
  filter:drop-shadow(0 0 30px rgba(var(--neon-rgb),.25))}
.lterm{width:min(330px,84vw);min-height:132px;text-align:left}
.lterm .tl{font:500 12.5px/1.75 var(--mono);white-space:nowrap;
  display:flex;gap:8px;opacity:0}
.lterm .tl.show{opacity:1}
.lterm .tl .pfx{color:var(--neon)}
.lterm .tl .lbl{color:#7fcf9f}
.lterm .tl .dts{color:rgba(122,151,132,.6);overflow:hidden;flex:1}
.lterm .tl .st{color:var(--neon);font-weight:700}
.lterm .tl .st.rd{color:#FFB84D}
.ltype{display:flex;align-items:center}
.ltype span{font:800 clamp(26px,7vw,38px)/1 var(--sans);letter-spacing:.32em;color:var(--text)}
.lcur{width:.55em;height:1.05em;background:var(--neon);display:inline-block;
  margin-left:6px;box-shadow:0 0 14px rgba(var(--neon-rgb),.9);
  animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ============================================================
   S1 · HERO
   ============================================================ */
#s1 .scene-inner{display:grid;gap:44px;align-items:center;padding:130px 0 100px}
@media(min-width:920px){#s1 .scene-inner{grid-template-columns:1.05fr .95fr;padding:80px 0}}
.hero-copy{max-width:640px}
.hero-copy .eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:24px}
.hero-copy .eyebrow::before{content:"";width:28px;height:1px;background:var(--neon);
  box-shadow:0 0 8px rgba(var(--neon-rgb),.8)}
.hero-title{margin-bottom:26px;perspective:600px}
.hero-title .ch{display:inline-block;will-change:transform}
.hero-lead{max-width:44ch;margin-bottom:40px}
.hero-cta{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero-link{font:600 14px var(--sans);color:var(--muted);text-decoration:none;
  display:inline-flex;gap:8px;align-items:center;transition:color .3s}
.hero-link:hover{color:var(--text)}
.hero-stage{perspective:1200px;display:flex;justify-content:center}
.hero-phone{width:min(252px,64vw);border-radius:40px;padding:10px;position:relative;
  transform:rotateY(-14deg) rotateX(6deg);transform-style:preserve-3d;will-change:transform;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 60px 130px -40px rgba(0,0,0,.95),0 0 100px -30px rgba(var(--neon-rgb),.35)}
.php-notch{position:absolute;top:19px;left:50%;transform:translateX(-50%);
  width:72px;height:18px;background:#000;border-radius:10px;z-index:3}
.php-scr{border-radius:31px;overflow:hidden;position:relative;
  background:radial-gradient(120% 90% at 50% 0%,#07130b,#020604 60%);
  border:1px solid rgba(255,255,255,.05);
  padding:52px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:15px}
.php-top{align-self:flex-start;font:900 13px var(--sans);letter-spacing:-.02em;color:var(--text)}
.php-top em{color:var(--neon);font-style:normal;font:700 8px var(--mono);
  vertical-align:2px;margin-left:4px;letter-spacing:.08em}
.php-ringwrap{position:relative;width:150px;height:150px}
.php-rbg{fill:none;stroke:rgba(var(--neon-rgb),.12);stroke-width:8}
.php-rfg{fill:none;stroke:var(--neon);stroke-width:8;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;
  stroke-dasharray:289;stroke-dashoffset:289;
  filter:drop-shadow(0 0 6px rgba(var(--neon-rgb),.8))}
.php-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.php-center b{font:800 30px var(--mono);color:var(--neon);letter-spacing:-.02em}
.php-center s{text-decoration:none;font:600 9px var(--mono);letter-spacing:.2em;color:var(--muted)}
.php-time{font:700 22px var(--mono);letter-spacing:.05em;color:var(--text)}
.php-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.php-chips span{font:600 9.5px var(--mono);letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line);background:rgba(var(--neon-rgb),.05);
  padding:6px 10px;border-radius:999px;white-space:nowrap}
.php-chips b{color:var(--text)}
.php-glow{position:absolute;inset:-30%;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 55%,rgba(var(--neon-rgb),.25),transparent 70%);
  filter:blur(30px)}
.hero-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--muted)}
.hero-hint span{font:600 10px var(--mono);letter-spacing:.32em}
.hero-hint i{width:1px;height:46px;display:block;
  background:linear-gradient(var(--neon),transparent);
  animation:hint 1.9s var(--ease-out) infinite}
@keyframes hint{
  0%{transform:scaleY(0);transform-origin:top}
  45%{transform:scaleY(1);transform-origin:top}
  55%{transform:scaleY(1);transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}}

/* ============================================================
   S2 · MUAMMO — bildirishnoma-bombardimon
   ============================================================ */
#s2{overflow:hidden}
#bg2::after{background:linear-gradient(180deg,#000,rgba(0,0,0,.45) 30%,rgba(0,0,0,.45) 70%,#000 100%)}
.noti-field{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.noti{position:absolute;width:min(248px,66vw);border-radius:15px;padding:12px 14px;
  background:rgba(10,16,12,.88);border:1px solid rgba(255,255,255,.1);
  box-shadow:0 24px 60px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;gap:11px;align-items:flex-start;will-change:transform}
.noti .ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font:800 15px var(--sans);color:#fff}
.noti .tx{min-width:0}
.noti .nm{font:700 12.5px var(--sans);color:var(--text);display:flex;gap:8px;align-items:baseline}
.noti .nm s{text-decoration:none;font:500 9.5px var(--mono);color:var(--muted)}
.noti .ms{font:400 12px/1.4 var(--sans);color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noti .dotr{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;
  background:#ff4d4d;box-shadow:0 0 10px rgba(255,77,77,.8)}
.prob-inner{text-align:center}
.prob-fact{display:flex;flex-direction:column;align-items:center;gap:10px}
.prob-num{display:flex;align-items:baseline;color:var(--neon);
  text-shadow:0 0 60px rgba(var(--neon-rgb),.5)}
.prob-num i{font-style:normal;font-size:.5em;color:var(--neon-dp);margin-left:6px}
.prob-cap{font:600 clamp(10px,1.4vw,13px)/1 var(--mono);letter-spacing:.3em;color:var(--muted)}
.prob-h{margin-top:26px;max-width:17ch}
.prob-sub{max-width:46ch;margin-top:14px}

/* ============================================================
   S3 · YECHIM — jonli stat teatri
   ============================================================ */
#s3{background:var(--black);overflow:hidden}
.sol-glow{position:absolute;left:50%;top:50%;width:130vmax;height:130vmax;
  transform:translate(-50%,-50%);pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(var(--neon-rgb),.13),rgba(var(--neon-rgb),.03) 34%,transparent 62%)}
.sol-inner{position:relative;z-index:5;text-align:center;padding:110px 0 90px}
.sol-head{margin-bottom:44px}
.sol-head .eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px}
.sol-head .eyebrow::before{content:"";width:28px;height:1px;background:var(--neon)}
.sol-stage{position:relative;min-height:480px;display:flex;align-items:center;justify-content:center}
.sol-timer{border-radius:26px;padding:30px 44px;display:inline-flex;flex-direction:column;
  align-items:center;gap:10px;position:relative;z-index:3}
.st-label{display:flex;align-items:center;gap:9px;
  font:600 10.5px var(--mono);letter-spacing:.3em;color:var(--muted)}
.st-label i{width:7px;height:7px;border-radius:50%;background:#ff5555;
  box-shadow:0 0 10px rgba(255,85,85,.9);animation:rec 1.4s ease-in-out infinite}
@keyframes rec{50%{opacity:.35}}
.st-digits{font:800 clamp(46px,9vw,88px)/1 var(--mono);letter-spacing:-.01em;color:var(--text);
  font-variant-numeric:tabular-nums;text-shadow:0 0 50px rgba(var(--neon-rgb),.35)}
.sol-card{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;
  align-items:center;gap:12px;will-change:transform}
.sol-card>s{text-decoration:none;font:600 10px var(--mono);letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ring-mini{position:relative;width:96px;height:96px}
.rm-bg{fill:none;stroke:rgba(var(--neon-rgb),.13);stroke-width:8}
.rm-fg{fill:none;stroke:var(--neon);stroke-width:8;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;
  stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 5px rgba(var(--neon-rgb),.8))}
.ring-mini b{position:absolute;inset:0;display:grid;place-items:center;
  font:800 19px var(--mono);color:var(--neon)}
.days{display:grid;grid-template-columns:repeat(7,16px);gap:6px}
.days i{width:16px;height:16px;border-radius:5px;background:rgba(var(--neon-rgb),.10);
  border:1px solid rgba(var(--neon-rgb),.14)}
.sc-graph svg{width:180px;display:block}
.ema-line{fill:none;stroke:var(--neon);stroke-width:2.6;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 5px rgba(var(--neon-rgb),.7))}
.ema-area{fill:url(#emaGrad);fill:rgba(var(--neon-rgb),.08);opacity:0}
.ema-dot{fill:var(--neon);opacity:0;filter:drop-shadow(0 0 8px rgba(var(--neon-rgb),1))}
.sol-final{margin-top:48px;font:400 clamp(17px,2.6vw,24px)/1.5 var(--sans);color:var(--muted)}
.sol-final b{color:var(--text);font-weight:800}
/* desktop: kartalar taymer atrofida suzadi */
@media(min-width:960px){
  .sc-ring{position:absolute;right:5%;top:0}
  .sc-streak{position:absolute;left:3%;top:22%}
  .sc-graph{position:absolute;right:9%;bottom:2%}
}
/* mobil: taymer keng, kartalar bir qatorda mini bo'lib teriladi */
@media(max-width:959px){
  .sol-stage{flex-direction:row;flex-wrap:wrap;justify-content:center;
    align-items:stretch;gap:12px;min-height:0}
  .sol-timer{flex:0 0 100%;padding:20px 24px}
  .sol-card{padding:13px 15px;gap:9px}
  .ring-mini{width:66px;height:66px}
  .ring-mini b{font-size:14px}
  .days{grid-template-columns:repeat(7,11px);gap:4px}
  .days i{width:11px;height:11px;border-radius:3px}
  .sc-graph svg{width:124px}
  .sol-inner{padding:84px 0 50px}
  .sol-head{margin-bottom:24px}
  .sol-final{margin-top:26px;font-size:15px}
}

/* ============================================================
   S4 · EVEREST TIZIMI — ko'tarilish xaritasi
   ============================================================ */
#s4{overflow:hidden}
#bg4::after{background:linear-gradient(180deg,#000,rgba(0,0,0,.55) 26%,rgba(0,0,0,.55) 70%,#000 100%)}
.jr-inner{text-align:center;padding:100px 0 60px}
.jr-head .eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px}
.jr-head .eyebrow::before{content:"";width:28px;height:1px;background:var(--neon)}
.jr-sub{max-width:40ch;margin:14px auto 0}
.jr-stage{position:relative;aspect-ratio:380/560;margin:30px auto 0;
  width:min(400px,90vw,calc((100svh - 340px)*.68))}
.jr-ghost{fill:none;stroke:rgba(255,255,255,.13);stroke-width:2;
  stroke-dasharray:2 8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.jr-line{fill:none;stroke:var(--neon);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 8px rgba(var(--neon-rgb),.9))}
.jr-dot{position:absolute;top:0;left:0;width:13px;height:13px;border-radius:50%;
  background:#fff;box-shadow:0 0 16px var(--neon),0 0 44px rgba(var(--neon-rgb),.8);
  visibility:hidden;z-index:4}
.jr-camp{position:absolute;z-index:3;width:0;height:0}
.jr-camp .pt{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;
  background:var(--neon);box-shadow:0 0 16px rgba(var(--neon-rgb),.9);display:block}
.jr-camp .pt::after{content:"";position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(var(--neon-rgb),.55);animation:ping 2.2s ease-out infinite}
.jr-camp .pt.sum{background:#fff;box-shadow:0 0 22px #fff,0 0 60px rgba(var(--neon-rgb),1)}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
.jr-camp .lab{position:absolute;top:0;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:rgba(6,14,9,.78);border:1px solid rgba(var(--neon-rgb),.22);
  border-radius:12px;padding:9px 13px;white-space:nowrap;
  box-shadow:0 18px 50px -16px rgba(0,0,0,.8)}
.jr-camp .lab.jl-r{left:20px}
.jr-camp .lab.jl-l{right:20px;align-items:flex-end}
.jr-camp .lab b{font:800 14px var(--mono);color:var(--neon);letter-spacing:-.01em}
.jr-camp .lab s{text-decoration:none;font:600 9.5px var(--mono);letter-spacing:.16em;
  color:var(--muted);text-transform:uppercase}

/* ============================================================
   S5 · AI USTOZ — qahramon skaneri
   ============================================================ */
#s5{background:var(--black);overflow:hidden}
.ai-inner{text-align:center;padding:100px 0 70px}
.ai-head .eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px}
.ai-head .eyebrow::before{content:"";width:28px;height:1px;background:var(--neon)}

.crn{position:absolute;width:20px;height:20px;z-index:4;

.crn.c2{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.crn.c3{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.crn.c4{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.ai-tag{position:absolute;z-index:6;display:flex;align-items:center;gap:9px;

  margin-left:1px;font-size:11px}

.ai-tag.t2{right:0;top:52%}
.ai-tag.t3{left:0;top:66%}

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   GLOBAL INFRA · Lenis + GSAP + video menejer + i18n
   ============================================================ */
gsap.registerPlugin(ScrollTrigger);
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Lenis silliq skroll (GSAP bilan sinxron) ---------- */
var lenis = new Lenis({ lerp:.09, wheelMultiplier:1, smoothWheel:true });
window.FAI_lenis = lenis;
lenis.on('scroll', ScrollTrigger.update);
gsap.ticker.add(function(t){ lenis.raf(t*1000); });
gsap.ticker.lagSmoothing(0);

/* anchor havolalar Lenis orqali */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href^="#"]'); if(!a) return;
  var el = document.querySelector(a.getAttribute('href'));
  if(el){ e.preventDefault(); lenis.scrollTo(el, {duration:1.4}); }
});

/* ilovaga o'tishda belgi: keyingi tashriflar to'g'ri ilovaga kiradi */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href="index.html"]'); if(!a) return;
  try{ localStorage.setItem('fai_landing_seen','1'); }catch(err){}
});

/* ---------- video menejer: ko'rinsa o'ynaydi, yo'qolsa to'xtaydi ---------- */
var vidObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    var v = en.target;
    if(en.isIntersecting){ v.play && v.play().catch(function(){}); }
    else { v.pause && v.pause(); }
  });
},{ threshold:.12 });
window.FAI_video = function(src, poster, cls){
  var v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
  v.setAttribute('muted',''); v.setAttribute('playsinline','');
  v.src = src; if(poster) v.poster = poster; if(cls) v.className = cls;
  vidObserver.observe(v);
  return v;
};

/* ---------- i18n ---------- */
var LANG = 'uz';
try{ var sv = localStorage.getItem('fai_lang'); if(sv) LANG = sv; }catch(e){}
var I18N = {

var v4 = FAI_video('assets/video/everest.mp4','assets/video/everest-poster.jpg');
bg4.appendChild(v4);
gsap.set(v4,{ scale:1.06, filter:'brightness(.5) saturate(.9)' });
v4.addEventListener('loadedmetadata', function(){ v4.playbackRate = .75; });

/* lagerlarni yo'l ustiga aniq o'rnatish */
var path = document.getElementById('jrPath');
var L = path.getTotalLength();
var FRACS = [.20, .46, .72, .985];
var camps = ['jc1','jc2','jc3','jc4'].map(function(id, i){
  var p = path.getPointAtLength(FRACS[i]*L);
  var el = document.getElementById(id);
  el.style.left = (p.x/380*100)+'%';
  el.style.top  = (p.y/560*100)+'%';
  return el;
});

/* skroll-kino */
var tl = gsap.timeline({
  scrollTrigger:{
    trigger:'#s4', start:'top top', end:'+=300%',
    pin:true, scrub:.6, anticipatePin:1
  }
});

tl.from('.jr-head', { y:50, autoAlpha:0, ease:'power3.out', duration:.6 }, 0)
  .to(v4, { scale:1.2, ease:'none', duration:4.2 }, 0)

/* yo'l chiziladi + nur-yo'lovchi ko'tariladi */
  .set('#jrDot', { visibility:'visible' }, .55)
  .to('#jrPath', { strokeDashoffset:0, ease:'none', duration:3 }, .6)
  .to('#jrDot', {
    motionPath:{ path:'#jrPath', align:'#jrPath', alignOrigin:[.5,.5] },
    ease:'none', duration:3
  }, .6);

/* lagerlar — nur yetganda yonadi */
camps.forEach(function(el, i){
  var t = .6 + 3*FRACS[i];
  tl.from(el.querySelector('.pt'), { scale:0, ease:'back.out(2.4)', duration:.22 }, t)
    .from(el.querySelector('.lab'), {
      x:(el.querySelector('.lab').classList.contains('jl-r') ? -16 : 16),
      autoAlpha:0, ease:'power2.out', duration:.3
    }, t + .05);
});

/* cho'qqida nafas */
tl.to('#jc4 .pt', { scale:1.35, ease:'power1.inOut', duration:.3 }, 3.75)
  .to({}, { duration:.5 });

if(reduced){ tl.progress(1).kill(); }
})();
</script>

<script>
/* ============================================================
   S6 · LIGA — rejissyorlik
   ============================================================ */
(function(){
"use strict";
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

FAI_addStrings({
  uz:{ lg_eye:"Liga", lg_h:"Raqobat seni o'stiradi.", lg_week:"Bu hafta", lg_you:"SEN",
       lg_final:"Yolg'iz emassan. <b>Liga kutmoqda.</b>" },
  ru:{ lg_eye:"Лига", lg_h:"Соревнование растит тебя.", lg_week:"Эта неделя", lg_you:"ТЫ",
       lg_final:"Ты не один. <b>Лига ждёт.</b>" },
  en:{ lg_eye:"The league", lg_h:"Competition makes you grow.", lg_week:"This week", lg_you:"YOU",
       lg_final:"You're not alone. <b>The league awaits.</b>" }
});
FAI_setText();

/* fon-kino: yorug' figura — transformatsiya */
var bg6 = document.getElementById('bg6');
var v6 = FAI_video('assets/video/s5.mp4','assets/video/s5-poster.jpg');
bg6.appendChild(v6);
gsap.set(v6,{ scale:1.05, filter:'brightness(.5)' });

/* qatorlar geometriyasi */
var ROW = matchMedia('(max-height:840px)').matches ? 56
        : (matchMedia('(max-width:600px)').matches ? 62 : 70);
var rows = {
  r1:document.getElementById('lr1'), r2:document.getElementById('lr2'),
  r3:document.getElementById('lr3'), r4:document.getElementById('lr4'),
  me:document.getElementById('lrMe')
};
document.getElementById('lgRows').style.height = (ROW*5 - 10)+'px';
/* boshlang'ich joylashuv: 1..5 */
gsap.set(rows.r1,{ y:0 });     gsap.set(rows.r2,{ y:ROW });
gsap.set(rows.r3,{ y:ROW*2 }); gsap.set(rows.r4,{ y:ROW*3 });
gsap.set(rows.me,{ y:ROW*4 });

var meHrs = document.getElementById('meHrs');
var hrs = { v:187 };
function updHrs(){ meHrs.textContent = Math.round(hrs.v)+'h'; }

/* skroll-kino */
var tl = gsap.timeline({
  scrollTrigger:{
    trigger:'#s6', start:'top top', end:'+=260%',
    pin:true, scrub:.6, anticipatePin:1
  }
});

tl.from('.lg-head', { y:50, autoAlpha:0, ease:'power3.out', duration:.6 }, 0)
  .to(v6, { scale:1.16, ease:'none', duration:4.6 }, 0)
  .from('#lgBoard', { y:70, autoAlpha:0, ease:'power3.out', duration:.7 }, .4)
  .from('.lg-row', { autoAlpha:0, x:-34, stagger:.09, ease:'power2.out', duration:.5 }, .8);

/* quvib o'tish mexanikasi: SEN qatori ko'tariladi, raqib tushadi */
function overtake(t, rival, meToY, rivalToY, meRank, rivalRank, hrsTo){
  tl.to(hrs, { v:hrsTo, duration:.5, ease:'power1.inOut', onUpdate:updHrs }, t)
    .to(rows.me, { y:meToY, scale:1.04, duration:.45, ease:'power2.inOut' }, t + .3)
    .to(rows.me, { scale:1, duration:.2 }, t + .78)
    .to(rival,   { y:rivalToY, duration:.45, ease:'power2.inOut' }, t + .3)
    .set(rows.me.querySelector('.rk'), { textContent:String(meRank) }, t + .5)
    .set(rival.querySelector('.rk'),   { textContent:String(rivalRank) }, t + .5);
}
overtake(1.5, rows.r4, ROW*3, ROW*4, 4, 5, 258); /* Diyor'dan o'tish */
overtake(2.3, rows.r3, ROW*2, ROW*3, 3, 4, 305); /* Aziz'dan o'tish */
overtake(3.1, rows.r2, ROW,   ROW*2, 2, 3, 368); /* Timur'dan o'tish */

/* g'alaba pulsi + xulosa */
tl.fromTo(rows.me, { boxShadow:'0 0 34px -8px rgba(57,255,140,.45)' },
  { boxShadow:'0 0 60px -4px rgba(57,255,140,.85)', duration:.35, yoyo:true, repeat:1 }, 3.95)
  .from('#lgFinal', { y:30, autoAlpha:0, ease:'power3.out', duration:.6 }, 4.25)
  .to({}, { duration:.5 });

if(reduced){
  tl.progress(1).kill();
  updHrs();
}
})();
</script>
