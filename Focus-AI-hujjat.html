<style>
html{color-scheme:dark}html,body,*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}@media print{body{background:#030806!important}#topbar{display:none!important}}*{margin:0}html{-webkit-text-size-adjust:100%}</style>
<title>Focus AI</title>

<style>
  /* Ranglar Focus AI ilovasining o'z tokenlaridan — bir belgigacha bir xil. */
  :root{
    --ground:#030806; --panel:#081209; --panel-2:#0c1a0f;
    --line:rgba(90,255,160,.09); --line-hard:rgba(90,255,160,.22);
    --signal:#39FF8C; --signal-br:#7CFFB5; --signal-rgb:57,255,140;
    --signal-dim:rgba(57,255,140,.13); --on-signal:#04130a;
    --text:#EAFBF0; --muted:#7a9784;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
    --sans:'Space Grotesk','Inter var',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --r:20px; --r-md:16px; --r-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1); --t2:220ms;
    --measure:66ch;
    --s1:.35rem; --s2:.7rem; --s3:1.15rem; --s4:1.9rem; --s5:3rem; --s6:4.6rem;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--text);
    font-family:var(--sans); font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:74rem; margin:0 auto; padding:calc(var(--s5) + 2.6rem) 1.5rem var(--s6)}
  @media(max-width:640px){ .wrap{padding:calc(var(--s4) + 2.6rem) 1.1rem var(--s5)} }

  /* ── yuqori panel: Ortga + til ── */
  #topbar{position:fixed; top:0; left:0; right:0; z-index:99;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
    background:linear-gradient(180deg,var(--ground) 60%,transparent);}
  #backBtn{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
    font-size:13px; color:var(--signal); text-decoration:none; background:var(--panel);
    border:1px solid var(--line-hard); border-radius:11px; padding:9px 13px;}
  .langsw{display:flex; gap:4px; background:var(--panel); border:1px solid var(--line-hard);
    border-radius:11px; padding:3px}
  .langsw button{font-family:var(--mono); font-size:12px; letter-spacing:.05em; color:var(--muted);
    background:transparent; border:0; border-radius:8px; padding:6px 10px; cursor:pointer;
    transition:.18s var(--ease)}
  .langsw button.on{color:var(--on-signal); background:var(--signal)}
  .langsw button:focus-visible{outline:2px solid var(--signal); outline-offset:2px}

  .rule{height:9px; margin:var(--s5) 0 var(--s4);
    background-image:linear-gradient(90deg,var(--line-hard) 1px,transparent 1px);
    background-size:9px 9px; background-position:0 bottom; background-repeat:repeat-x;
    border-bottom:1px solid var(--line);}
  .eyebrow{font-family:var(--mono); font-size:.68rem; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted); margin:0 0 var(--s3);}
  h1{font-family:var(--sans); font-weight:800; letter-spacing:-.03em;
    font-size:clamp(2.1rem,6.4vw,3.5rem); line-height:1.04; margin:0 0 var(--s3);
    text-wrap:balance; max-width:20ch;}
  .lede{max-width:var(--measure); color:var(--muted); font-size:1.06rem; margin:0}
  .lede strong{color:var(--text); font-weight:600}
  .lede em{color:var(--text); font-style:italic}

  .thesis{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:var(--s4) 0 0;}
  @media(max-width:560px){ .thesis{grid-template-columns:1fr} }
  .th-cell{background:var(--panel); padding:1.15rem 1.25rem}
  .th-k{font-family:var(--mono); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:0 0 .55rem;}
  .th-v{margin:0; font-size:1.02rem; line-height:1.5}
  .th-v strong{color:var(--text); font-weight:600}
  .th-cell.on{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--signal)}
  .th-cell.on .th-k{color:var(--signal)}

  .figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:var(--r);
    overflow:hidden; margin:var(--s3) 0 0;}
  .fig{background:var(--panel); padding:1rem 1.1rem}
  .fig b{display:block; font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:1.7rem; font-weight:700; color:var(--signal); letter-spacing:-.02em;}
  .fig span{display:block; font-family:var(--mono); font-size:.63rem; letter-spacing:.15em;
    text-transform:uppercase; color:var(--muted); margin-top:.3rem;}

  section{margin:0}
  h2{font-size:1.42rem; font-weight:700; letter-spacing:-.018em; margin:0 0 .4rem; text-wrap:balance;}
  .sec-note{color:var(--muted); margin:0 0 var(--s3); max-width:var(--measure); font-size:.97rem}
  .sec-note code{font-family:var(--mono); font-size:.85em; background:var(--signal-dim);
    padding:.08em .38em; border-radius:5px; color:var(--signal);}
  .sec-note em{color:var(--text); font-style:italic}

  .rows{display:flex; flex-direction:column; gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden}
  .row{background:var(--panel); display:grid; grid-template-columns:13.5rem 1fr;
    gap:1.4rem; padding:.95rem 1.15rem; align-items:baseline;}
  @media(max-width:700px){ .row{grid-template-columns:1fr; gap:.3rem; padding:.9rem 1rem} }
  .k{font-family:var(--mono); font-size:.74rem; letter-spacing:.06em; color:var(--signal);
    font-weight:500; line-height:1.5;}
  .v{margin:0; font-size:.97rem; color:var(--text); line-height:1.55}
  .v strong{font-weight:600}
  .v em{color:var(--muted); font-style:normal}
  .v code{font-family:var(--mono); font-size:.85em; background:var(--signal-dim);
    padding:.08em .38em; border-radius:5px; color:var(--signal);}

  .tags{display:flex; flex-wrap:wrap; gap:.45rem; margin:var(--s3) 0 0}
  .tag{font-family:var(--mono); font-size:.68rem; letter-spacing:.07em; padding:.36rem .66rem;
    border-radius:10px; border:1px solid var(--line-hard); color:var(--muted); background:var(--panel);}
  .tag.on{color:var(--signal); border-color:var(--signal); background:var(--signal-dim)}

  .honest{border:1px solid var(--line-hard); border-left:3px solid var(--signal);
    background:var(--panel); border-radius:0 var(--r-md) var(--r-md) 0; padding:1.15rem 1.3rem; margin:var(--s3) 0 0;}
  .honest h3{font-family:var(--mono); font-size:.7rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--signal); margin:0 0 .6rem; font-weight:600;}
  .honest ul{margin:0; padding-left:1.1rem; display:flex; flex-direction:column; gap:.45rem}
  .honest li{color:var(--text); font-size:.96rem}
  .honest li strong{font-weight:600}
  .honest li em{color:var(--muted); font-style:normal}

  footer{margin-top:var(--s5); padding-top:var(--s3); border-top:1px solid var(--line);
    font-family:var(--mono); font-size:.72rem; color:var(--muted);
    display:flex; flex-wrap:wrap; gap:.5rem 1.6rem;}
</style>

function esc(){return '';}
function build(d){
  var h='';
  h+='<p class="eyebrow">'+d.eyebrow+'</p>';
  h+='<h1>'+d.h1+'</h1>';
  h+='<p class="lede">'+d.lede+'</p>';
  h+='<div class="thesis">'+
     '<div class="th-cell"><p class="th-k">'+d.thesis[0][0]+'</p><p class="th-v">'+d.thesis[0][1]+'</p></div>'+
     '<div class="th-cell on"><p class="th-k">'+d.thesis[1][0]+'</p><p class="th-v">'+d.thesis[1][1]+'</p></div></div>';
  h+='<div class="figs">'+d.figs.map(function(f){return '<div class="fig"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>';}).join('')+'</div>';
  d.secs.forEach(function(s){
    h+='<div class="rule"></div><section><h2>'+s.t+'</h2>';
    if(s.n)h+='<p class="sec-note">'+s.n+'</p>';
    h+='<div class="rows">'+s.rows.map(function(r){return '<div class="row"><div class="k">'+r[0]+'</div><p class="v">'+r[1]+'</p></div>';}).join('')+'</div>';
    if(s.tags)h+='<div class="tags">'+s.tags.map(function(t,i){return '<span class="tag'+(i<2?' on':'')+'">'+t+'</span>';}).join('')+'</div>';
    h+='</section>';
  });
  // halollik
  h+='<div class="rule"></div><section><h2>'+d.honest.t+'</h2><p class="sec-note">'+d.honest.n+'</p>'+
     '<div class="honest"><h3>'+d.honest.h+'</h3><ul>'+d.honest.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></section>';
  // xavfsizlik
  h+='<div class="rule"></div><section><h2>'+d.sec.t+'</h2><p class="sec-note">'+d.sec.n+'</p>'+
     '<div class="rows">'+d.sec.rows.map(function(r){return '<div class="row"><div class="k">'+r[0]+'</div><p class="v">'+r[1]+'</p></div>';}).join('')+'</div></section>';
  h+='<footer>'+d.footer.map(function(f){return '<span>'+f+'</span>';}).join('')+'</footer>';
  return h;
}
function render(lang){
  if(!I18N[lang])lang='uz';
  document.documentElement.setAttribute('lang',lang);
  document.getElementById('doc').innerHTML=build(I18N[lang]);
  var b=document.querySelector('#backBtn span'); if(b)b.textContent=I18N[lang].back;
  [].forEach.call(document.querySelectorAll('#langsw button'),function(x){
    x.classList.toggle('on',x.getAttribute('data-l')===lang);
  });
  try{localStorage.setItem('fai_lang',lang);}catch(e){}
}
/* boshlang'ich til: ilova/landing bilan bir xil (fai_lang) */
var start='uz';
try{var s=localStorage.getItem('fai_lang'); if(s&&I18N[s])start=s;}catch(e){}
document.querySelectorAll('#langsw button').forEach(function(x){
  x.addEventListener('click',function(){render(x.getAttribute('data-l'));});
});
render(start);
</script>
